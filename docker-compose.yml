services:
  consul:
    image: hashicorp/consul:2.0
    container_name: consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"   # HTTP API & UI
      - "8600:8600/udp" # DNS
    networks:
      - backend

  users-service:
    build:
      context: services/users
      dockerfile: Dockerfile
    container_name: users-service
    env_file:
      - services/users/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SERVICE_NAME: users-service
      SERVICE_PORT: 8001
    depends_on:
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started
    ports:
      - "8001:8001"
    networks:
      - backend

  leave-service:
    build:
      context: services/leave
      dockerfile: Dockerfile
    container_name: leave-service
    env_file:
      - ./services/leave/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SERVICE_NAME: leave-service
      SERVICE_PORT: 8002
    depends_on:
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started
    ports:
      - "8002:8002"
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: notification-service
    env_file:
      - ./services/notification/.env
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SERVICE_NAME: notification-service
      SERVICE_PORT: 8003   # adjust if you expose it
    depends_on:
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - backend

  gateway:
    build:
      context: services/gateway
      dockerfile: Dockerfile
    container_name: gateway
    env_file:
      - services/gateway/.env
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      # JWT_SECRET_KEY can also be set here or in .env
    depends_on:
      - users-service
      - leave-service
      - consul
    ports:
      - "8000:8000"
    networks:
      - backend

networks:
  backend:
    driver: bridge